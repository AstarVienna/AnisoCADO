[project]
name = "AnisoCADO"
version = "0.6.1.dev0"
description = "Generate off-axis SCAO PSFs for the ELT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = [ "astronomy" ]
dynamic = [ "classifiers" ]
license = "GPL-3.0-or-later"
authors = [
    {name = "Kieran Leschinski", email = "kieran.leschinski@unive.ac.at"}
]
maintainers = [
    {name = "Kieran Leschinski", email = "kieran.leschinski@unive.ac.at"},
    {name = "Hugo Buddelmeijer", email =" hugo@buddelmeijer.nl"},
    {name = "Fabian Haberhauer", email = "fabian.haberhauer@univie.ac.at"},
]
dependencies = [
    "numpy (>=2.2.6,<3.0.0)",
    "astropy (>=7.0.2,<9.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
]

[project.urls]
Repository = "https://github.com/AstarVienna/AnisoCADO/"
Documentation = "https://anisocado.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/AstarVienna/AnisoCADO/issues"
Changelog = "https://github.com/AstarVienna/AnisoCADO/releases"


[tool.poetry]
classifiers=[
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pylint = "^4.0.6"
black = "^26.5.1"
mypy = "^2.3.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
sphinx-book-theme = "^1.4.0"
sphinx-copybutton = ">=0.5.2,<1.0"
sphinxcontrib-apidoc = ">=0.6.0,<1.0"
sphinxcontrib-mermaid = "^2.1.0"
myst-nb = "^1.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "webtest: marks tests as requiring network (deselect with '-m \"not webtest\"')",
]
filterwarnings = [
    "error",
    # Should fix at some point
    "ignore::ResourceWarning",
]

[tool.coverage.report]
omit = ["anisocado/tests/*", "docs/*"]
